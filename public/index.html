<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ICSHD العالمية</title>
    
    <!-- أيقونة الموقع -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    
    <!-- Bootstrap RTL CSS & Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --accent-yellow: #f59e0b;
            --accent-blue: #38bdf8;
        }

        body {
            background: radial-gradient(circle at top, #1e293b, var(--bg-main));
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .card-custom {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease;
        }

        .math-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-blue);
            text-align: center;
            letter-spacing: 3px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        .timer-badge {
            font-size: 1.25rem;
            background: #ef4444;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .engine-status {
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 20px;
            background: #334155;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .engine-status.online {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .btn-warning-custom {
            background-color: var(--accent-yellow);
            color: #0f172a;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-warning-custom:hover {
            background-color: #d97706;
            color: #fff;
            transform: translateY(-2px);
        }

        .form-control, .form-select {
            border-color: var(--border-color);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <!-- شريط حالة محرك التكيف العنقودي -->
    <div class="d-flex justify-content-end mb-3">
        <span id="engineStatus" class="engine-status">
            <i class="fa-solid fa-network-wired me-1"></i> جاري الاتصال بمحرك التكيف...
        </span>
    </div>

    <!-- شاشة الدخول الموحدة -->
    <div id="authSection" class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 text-center">
                <div class="mb-3">
                    <i class="fa-solid fa-brain fa-3x text-warning"></i>
                </div>
                <h2 class="mb-2 fw-bold text-warning">منصة ICSHD الدولية</h2>
                <p class="text-muted mb-4">أدخل شفرة العبقري الموحدة لدخول المنصة</p>
                
                <div class="mb-3">
                    <input type="text" id="geniusCodeInput" class="form-control form-control-lg text-center fs-4 bg-dark text-light border-secondary" placeholder="مثال: test_genius_001" onkeypress="handleLoginEnter(event)">
                </div>
                <button onclick="login()" class="btn btn-warning-custom btn-lg w-100 py-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> دخول المنصة
                </button>
            </div>
        </div>
    </div>

    <!-- صالة التحديات والبطولات -->
    <div id="arenaSection" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4 card-custom p-3">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary">
                    <i class="fa-solid fa-user-ninja fa-2x"></i>
                </div>
                <div>
                    <h4 id="welcomeMessage" class="m-0 text-info fw-bold">أهلاً بك يا عبقري</h4>
                    <small id="userRoleBadge" class="text-muted"><i class="fa-solid fa-certificate text-warning me-1"></i> حساب طالب معتمد</small>
                </div>
            </div>
            <div class="text-center">
                <div class="text-muted small mb-1">الوقت المتبقي</div>
                <span class="timer-badge" id="timerDisplay">60</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- لوحة الإعدادات -->
            <div class="col-lg-4">
                <div class="card card-custom p-4 h-100">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-sliders text-warning me-2"></i>إعدادات التحدي</h5>
                    <hr class="border-secondary mb-4">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">المستوى التعليمي:</label>
                        <select id="levelSelect" class="form-select bg-dark text-light p-2.5">
                            <option value="S">المباشر البسيط (S)</option>
                            <option value="F5">أصدقاء 5 (F5)</option>
                            <option value="F10">أصدقاء 10 (F10)</option>
                            <option value="MIX" selected>المختلط الشامل (MIX)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">عدد الخانات (Digits):</label>
                        <input type="number" id="digitsInput" class="form-control bg-dark text-light" value="1" min="1" max="5">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted">عدد الصفوف (Rows):</label>
                        <input type="number" id="rowsInput" class="form-control bg-dark text-light" value="3" min="2" max="50">
                    </div>

                    <button onclick="fetchNewQuestion()" class="btn btn-primary btn-lg w-100 mt-auto fw-bold py-2.5">
                        <i class="fa-solid fa-play me-2"></i> ابدأ التحدي التالي
                    </button>
                </div>
            </div>

            <!-- لوحة المسألة الحية -->
            <div class="col-lg-8">
                <div class="card card-custom p-4 text-center h-100 d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="text-start fw-bold mb-3"><i class="fa-solid fa-calculator text-info me-2"></i>المسألة الحالية</h5>
                        <div id="mathColumn" class="math-display my-3 p-3">
                            <div class="text-muted fs-5 fw-normal">اضغط "ابدأ التحدي" لتوليد المسألة</div>
                        </div>
                    </div>

                    <div class="row justify-content-center mt-3">
                        <div class="col-md-8 col-lg-6">
                            <div class="input-group mb-3">
                                <input type="number" id="userAnswer" class="form-control form-control-lg text-center fs-2 bg-dark text-light border-secondary" placeholder="النتيجة" onkeypress="handleAnswerEnter(event)">
                            </div>
                            <button onclick="submitAnswer()" class="btn btn-success btn-lg w-100 fw-bold py-3 shadow">
                                <i class="fa-solid fa-check-double me-2"></i> تأكيد الإجابة
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSolution = null;
    let questionStartTime = 0;
    let currentSessionId = null;
    let currentLearnerId = "test_genius_001";

    function handleLoginEnter(e) {
        if (e.key === 'Enter') login();
    }

    function handleAnswerEnter(e) {
        if (e.key === 'Enter') submitAnswer();
    }

    async function login() {
        const code = document.getElementById('geniusCodeInput').value.trim();
        if (!code) return alert("يرجى إدخال شفرة العبقري");

        currentLearnerId = code;

        try {
            // استدعاء API الباك إند الحقيقي لإنشاء جلسة
            const res = await fetch('/sessions', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ learner_id: currentLearnerId })
            });
            
            if (res.ok) {
                const data = await res.json();
                currentSessionId = data.session_id || data.id;
            }
        } catch (err) {
            console.warn("استمرار الجلسة عبر النمط المباشر للـ WebSocket", err);
        }

        document.getElementById('authSection').classList.add('d-none');
        document.getElementById('arenaSection').classList.remove('d-none');
        document.getElementById('welcomeMessage').innerText = `أهلاً بك: ${currentLearnerId}`;
        fetchNewQuestion();
    }

    function fetchNewQuestion() {
        const rows = parseInt(document.getElementById('rowsInput').value) || 3;
        questionStartTime = Date.now();

        const numbers = [];
        let sum = 0;
        for (let i = 0; i < rows; i++) {
            const val = Math.floor(Math.random() * 9) + 1;
            numbers.push(val);
            sum += val;
        }
        currentSolution = sum;

        const mathCol = document.getElementById('mathColumn');
        mathCol.innerHTML = numbers.map((n, idx) => `<div>${idx === 0 ? n : '+' + n}</div>`).join('');

        document.getElementById('userAnswer').value = '';
        document.getElementById('userAnswer').focus();
    }

    function submitAnswer() {
        const ansInput = document.getElementById('userAnswer');
        const ans = parseInt(ansInput.value);
        if (isNaN(ans)) return;

        const responseTimeMs = Date.now() - questionStartTime;
        const isCorrect = (ans === currentSolution);

        // إرسال البيانات لحظياً لمكينة الـ WebSocket
        if (window.engineSocket && window.engineSocket.readyState === WebSocket.OPEN) {
            const payload = {
                timestamp: Date.now(),
                learner_id: currentLearnerId,
                session_id: currentSessionId,
                is_correct: isCorrect,
                response_time_ms: responseTimeMs,
                expected_time_ms: 3000
            };
            window.engineSocket.send(JSON.stringify(payload));
        }

        if (isCorrect) {
            alert("✨ إجابة صحيحة! أحسنت يا عبقري.");
            fetchNewQuestion();
        } else {
            alert("❌ إجابة خاطئة، حاول مرة أخرى.");
            ansInput.select();
        }
    }
</script>

<!-- نص الاتصال بمحرك التكيف لحظياً -->
<script src="/static/flow-engine.js"></script>

</body>
</html>
